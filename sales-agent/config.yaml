# ============================================================
# КОНФИГУРАЦИЯ АГЕНТА-ПРОДАЖНИКА
# Заполните разделы, помеченные "ЗАПОЛНИТЬ", перед первым запуском.
# Пока agency.name или icp.description пустые — агент НЕ ведёт
# холодную рассылку, а напоминает владельцу заполнить конфиг.
# ============================================================

agency:
  name: ""                 # ЗАПОЛНИТЬ: название агентства, напр. "Code.Market"
  website: ""              # ЗАПОЛНИТЬ: сайт агентства
  one_liner: ""            # ЗАПОЛНИТЬ: одно предложение — чем занимаетесь и какую пользу приносите
  services: []             # ЗАПОЛНИТЬ: список услуг, напр. ["Разработка сайтов", "Реклама в Яндекс.Директ"]
  cases: []                # Короткие кейсы с цифрами, напр. ["Салону красоты в Казани подняли записи на 40% за 2 месяца"]
  pricing_notes: ""        # Что можно говорить о ценах ("от 50 000 ₽/мес", "цена после брифа" и т.п.)
  sender_name: "Яна"
  sender_email: "yana.obgolts@gmail.com"

# Портрет идеального клиента (ICP) — кого искать
icp:
  description: ""          # ЗАПОЛНИТЬ: кто ваш клиент, напр. "локальный бизнес в сфере услуг без нормального сайта"
  industries: []           # напр. ["салоны красоты", "стоматологии", "фитнес-студии"]
  geography: ""            # напр. "Россия, города-миллионники"
  company_size: ""         # напр. "малый бизнес, 5–50 сотрудников"
  decision_makers: []      # роли, кому писать: ["владелец", "директор по маркетингу"]
  disqualifiers: []        # кого НЕ трогать, напр. ["конкуренты-агентства", "госучреждения"]

outreach:
  language: ru
  daily_cold_email_limit: 10     # жёсткий лимит холодных писем (черновиков) в день
  max_pending_drafts: 15         # если неотправленных черновиков больше — новые не создаём
  followups_max: 2               # максимум фоллоу-апов на лида
  followup_after_days: 4         # через сколько дней фоллоу-ап без ответа
  tone: "дружелюбный, деловой, без канцелярита и агрессивных продаж; на «вы» с маленькой буквы"
  goal: "договориться о коротком созвоне 20–30 минут с Яной"
  opt_out_line: "Если тема неактуальна — просто ответьте «неинтересно», и я больше не побеспокою."

owner:
  name: "Яна"
  email: "yana.obgolts@gmail.com"
  timezone: "Asia/Omsk"          # UTC+6
  calendar_id: "yana.obgolts@gmail.com"
  call_duration_minutes: 30
  working_hours:
    start: "10:00"
    end: "19:00"
  meeting_days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
  min_notice_hours: 20           # не ставить звонок раньше чем через N часов от текущего момента

gmail_labels:                    # агент создаст их при первом запуске, если их нет
  pipeline: "Продажи/Агент"
  needs_owner: "Продажи/Нужна Яна"
  call_scheduled: "Продажи/Звонок назначен"
