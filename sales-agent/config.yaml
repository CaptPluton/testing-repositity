agency:
  name: "Obgolts Media Group (OMG)"
  website: "https://obgolts-media.ru"
  links:
    instagram: "@obgolts_media"          # в письмах для РФ не использовать первым (Meta запрещена в РФ)
    telegram_channel: "t.me/obgolts_media_group"
    telegram_owner: "t.me/yana_obgolts"
  one_liner: "Digital-маркетинг: платный трафик и SMM под задачу клиента. Слоган: «Эстетика смысла. Бунт интеллекта. Искренность цифры.»"
  about: "Основатель — Яна Обгольц, 4 года в маркетинге (beauty, медицина, образование, производство). Клиенты — русскоязычный рынок (РФ/СНГ), работа удалённая."
  services:
    - "Платный трафик — таргет ВКонтакте, контекст Яндекс.Директ"
    - "SMM — контент, ведение соцсетей, комьюнити-менеджмент"
    - "Лидген с фиксированной ценой заявки (CPA) — для медицины и обучения"
    - "Веб-разработка — сайты и лендинги, в т.ч. Tilda"
    - "SEO"
    - "Репутационный менеджмент"
    - "Инфлюенс-маркетинг — блогеры и бартер под ключ"
    - "Брендинг — от стратегии до визуальной системы"
  # Альтернативный источник заявок (второй оффер в холодных письмах медицины и обучения)
  lead_gen_fixed_cpl:
    name: "Заявки с фиксированной ценой (CPA-лидген)"
    description: >
      Альтернативный канал заявок для масштабирования продаж: цена заявки
      фиксируется в договоре — клиент платит за результат, а не за показы.
      Все номера телефонов проходят СМС-валидацию до попадания в CRM,
      поэтому дозвон и конверсия в ответ заметно выше, чем у обычных лидов.
    executor: "партнёрская команда Prof Digital Agency (с 2020 г., 80% клиентов — бьюти и медицина; запуск рекламы за 1–3 дня; ориентиры по кейсам: заявка в медицине 1 100–1 800 ₽)"
    niches: [medicine, education]
    in_cold_emails: true
    packages_medicine:   # пакеты привлечения пациентов (КП Prof Digital) — озвучивать на переговорах, в письмах не перечислять
      - "Тест-драйв: работа 55 000 ₽ + бюджет от 50 000 ₽ → от 50 заявок; тестовый период 14 дней, не устроит результат — вторая неделя теста бесплатно"
      - "Бизнес-решение: работа 88 000 ₽ + бюджет от 100 000 ₽ → от 100 заявок (3 оффера, аналитика+CRM, репутация)"
      - "Полная система: работа 120 000 ₽ + бюджет от 150 000 ₽ → лендинг, CRM/коллтрекинг, уникальный оффер; гарантия: <30 заявок за 2 недели → продлеваем бесплатно или меняем формат"
    pricing_notes: "пакеты и цену заявки в переписке называть только диапазонами и после интереса; финальные условия договора — через Яну (эскалация)"
  # Кейсы: ниша → записи. no_metrics: true = цифр нет, использовать только как
  # упоминание опыта. partner: true = кейс партнёрской команды Prof Digital Agency
  # (партнёр OMG по CPA-лидгену и трафику для медицины/бьюти; OMG делает их
  # контент-стратегию) — в письмах формулировать «мы с партнёрской командой
  # Prof Digital…» или «наша команда лидгена…», не присваивать напрямую.
  cases:
    beauty:
      - client: "Тело Говорит (массажная студия)"
        what: "SMM + инфлюенс-маркетинг с бартером"
        no_metrics: true
    education:
      - client: "Академия Кинезиологии (Васильева)"
        what: "лидген в Instagram: квизы, автоворонки Manychat/Salebot; аудитория врачей ~30k"
        no_metrics: true
    medicine:
      - client: "Сеть стоматологий «Команда Мечты» (10 клиник, 10 городов)"
        what: "комплекс: ВК + Директ + посевы, ребрендинг, 10 сайтов"
        metrics: "за 6 мес: 5 682 заявки из ВК по 1 100 ₽, 8 376 заявок из Директа по 1 420 ₽; снизили стоимость заявки и выровняли поток первичных пациентов"
        partner: true
      - client: "Сеть стоматологий Dentis (7 городов)"
        what: "таргет ВК, сегментация офферов (имплантация, кариес, протезирование)"
        metrics: "тестовая кампания: 464 заявки, средняя цена заявки 1 797 ₽ — почти в 2 раза ниже рынка стоматологии"
        partner: true
      - client: "Медцентры «Хелз Лайф» и «Мед Стайл» (Калининград)"
        what: "оптимизация воронки от заявки до прихода: фильтрация трафика, валидация заявок, скрипты администраторов"
        metrics: "стоимость прихода пациента снижена с 8 998 до 5 264 ₽ (−3 700 ₽); конверсия в запись 25% → 34,5%, дозвон 60% → 85%, дубли 2,76% → 0,39%"
        partner: true
      - client: "Многопрофильная клиника «Волгамед» (Волгоград)"
        what: "валидация контактов, антидубль, сквозная аналитика, скрипты"
        metrics: "4 683 заявки по 1 400 ₽; стоимость прихода −23% (6 800 → 5 220 ₽); конверсия в запись 31% → 51,88%, в приход 25,87% → 45,05%"
        partner: true
      - client: "Центр «Живая вода» (Краснодар, профилактическая медицина)"
        what: "перестройка пути от заявки до прихода, CRM-интеграция"
        metrics: "3 077 заявок по 1 246 ₽; стоимость записи 6 039 → 3 440 ₽, прихода 6 398 → 4 799 ₽"
        partner: true
      - client: "Академия Кинезиологии"
        what: "работа с медицинской аудиторией (врачи, реабилитологи)"
        no_metrics: true
  pricing_notes: |
    Первая консультация — бесплатно (главный крючок CTA варианта B).
    В письмах цены только диапазонами и только если спросили; сметы — после брифа/созвона.
    Ориентиры (₽, РФ): SMM Instagram — 65 000/мес; TikTok или YouTube — 35 000/мес;
    комьюнити-менеджмент — 35 000/мес; блогеры/бартер — 50 000/мес;
    таргет ВК — 20 000/мес (1 оффер); Яндекс.Директ — 40 000/мес (1 оффер), бюджет отдельно;
    сайт под ключ на Tilda — 15 000 (+конверсионный квиз и настройка аналитики в подарок);
    SEO-оптимизация — от 25 000/мес;
    бренд-аудит — 35 000–75 000; логотип — 45 000–115 000; Branding 360 — 450 000–850 000.
    Условия: 50/50; при Branding 360 скидка до 15% на отдельные услуги.
    Торг, скидки сверх этого, валюта, US-пакеты — только через Яну (эскалация).
  sender_name: "Яна"
  sender_email: "yana.obgolts@gmail.com"

icp:
  description: "Малый и средний бизнес русскоязычного рынка в нишах бьюти, обучение и медицина, которому нужны платный трафик и системный SMM"
  industries:                     # порядок = приоритет
    - "бьюти (салоны, студии, косметология, массаж, ногтевой сервис)"
    - "обучение (онлайн-школы, курсы, экспертные и образовательные проекты)"
    - "медицина (клиники, стоматологии, мед-центры, частные врачи)"
  geography: "Россия и СНГ (в первую очередь города-миллионники), русскоязычные бизнесы за рубежом"
  company_size: "малый и средний бизнес, стартапы; локальные сети до ~10 точек"
  decision_makers: ["владелец / основатель", "директор", "директор по маркетингу"]
  disqualifiers:
    - "маркетинговые агентства (конкуренты)"
    - "госучреждения"
    - "крупные корпорации с внутренними отделами маркетинга"
    - "федеральные сети и франшизы-гиганты"
    - "тематики: политика, крипто, гэмблинг, МЛМ"

outreach:
  language: ru
  priority_services:
    - "Платный трафик — таргет ВКонтакте, контекст Яндекс.Директ"
    - "SMM — контент, ведение соцсетей, комьюнити-менеджмент"
  daily_cold_email_limit: 10       # жёсткий лимит холодных писем в день (требование Яны)
  niche_quota: {beauty: 4, education: 3, medicine: 3}   # ребаланс раз в 2 недели по правилам плейбука
  cold_days: ["Tue", "Wed", "Thu"] # дни холодных писем И реактивации; Пн/Пт — только фоллоу-апы и DM (в Пт письмо повиснет на выходные)
  followups_max: 3
  followup_after_days: [3, 7, 14]  # D+3, D+7, D+14 от ПОДТВЕРЖДЁННОЙ отправки предыдущего касания
  dm_touch_after_days: 2           # D+2: короткое VK/TG-сообщение (готовится в outbox, шлёт Яна)
  reactivation_after_days: 75      # no_response-лиды: повторное касание с новым углом
  max_pending_drafts: 15           # потолок неотправленных писем; при превышении — пауза + алерт (не молчаливый стоп)
  tone: "по Ильяхову: плоский язык, без воды и канцелярита; дерзко, но уважительно; на «вы»; коротко и по делу"
  goal: "договориться о созвоне 20–30 минут с Яной (вариант B) или дать микро-ценность и вывести на диалог (вариант A)"
  opt_out_line: "Если тема неактуальна — просто ответьте «неинтересно», и я больше не побеспокою."
  utm: "utm_source=cold_email&utm_medium=email&utm_campaign={niche}&utm_content={variant}"

